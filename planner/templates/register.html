{% extends 'base.html' %}

{% block content %}
    <h2>Register</h2>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
    <a href="/login/" class="link-btn">Already have an account? Login</a>
{% endblock %}
