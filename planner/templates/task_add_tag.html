{% extends 'base.html' %}

{% block content %}
    <h2>Add Tag to {{ task.title }}</h2>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <select name="tag">
                {% for tag in tags %}
                    <option value="{{ tag.id }}">{{ tag.name }}</option>
                {% endfor %}
            </select>
            <br><br>
            <button type="submit" class="btn btn-primary">Add Tag</button>
        </form>
    </div>
    <a href="/tasks/{{ task.id }}/" class="link-btn">Back to task</a>
{% endblock %}
