{% extends 'base.html' %}

{% block content %}
    <h2>Login</h2>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
    <a href="/register/" class="link-btn">Don't have an account? Register</a>
{% endblock %}
